# Docker's DNS. `resolve` keeps the replica list fresh, so
# `docker compose up --scale api=N` is picked up without a reload, and
# requests are round-robined across every api replica.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # stream CSV exports
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths render the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
